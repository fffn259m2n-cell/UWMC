name: scheduled-reports

# Real-data runs on GitHub's machines (which can reach CMS, PubMed and ClinicalTrials.gov).
# - Quality Signal Monitor: quarterly, after the usual CMS Care Compare refresh months.
# - EP Research Copilot: monthly. Its database is kept between runs (actions/cache), so each
#   digest shows what changed since the previous month.
# Results are attached to the run as downloadable artifacts (Actions -> this workflow -> a run).
# To run now: Actions -> scheduled-reports -> Run workflow.
# Note: the EP digest quotes publishers' abstracts. It is uploaded only while the repository
# is private; a public repository gets the trial tables and run counts only.

on:
  schedule:
    - cron: "17 14 20 1,4,7,10 *"   # quarterly, 20th of Jan/Apr/Jul/Oct, 14:17 UTC
    - cron: "23 14 2 * *"           # monthly, 2nd of each month, 14:23 UTC
  workflow_dispatch:
    inputs:
      which:
        description: "Which report to run"
        type: choice
        options: [both, quality-monitor, ep-copilot]
        default: both

permissions:
  contents: read

jobs:
  quality-monitor:
    if: github.event_name == 'workflow_dispatch' && inputs.which != 'ep-copilot' || github.event.schedule == '17 14 20 1,4,7,10 *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quality-signal-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch the current CMS release and build the UWMC report
        run: |
          set -o pipefail
          uwmc-monitor run --fetch --out output 2>&1 | tee run.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Quality Signal Monitor (real CMS data)"
            echo '```'
            cat run.txt 2>/dev/null || echo "run did not produce output"
            echo '```'
            if grep -q "403" run.txt 2>/dev/null; then
              echo "**data.cms.gov refused this request from GitHub's servers (HTTP 403).** This is CMS access policy, not a bug in the report."
              echo "Run it from your own computer instead: \`uwmc-monitor run --fetch\` (TESTING.md, Quality Signal Monitor), or download the three CSVs from data.cms.gov by hand (quality-signal-monitor/README.md, Offline or manual downloads)."
            else
              echo "Download the **quality-monitor-report** artifact below. Spot-check three values against Medicare Care Compare before sharing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-monitor-report
          path: |
            quality-signal-monitor/output/
            quality-signal-monitor/data/raw/*/manifest.json
          retention-days: 90
          if-no-files-found: warn

  ep-copilot:
    if: github.event_name == 'workflow_dispatch' && inputs.which != 'quality-monitor' || github.event.schedule == '23 14 2 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ep-research-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Restore last month's database (for change tracking)
        uses: actions/cache@v4
        with:
          path: ep-research-copilot/data/ep_copilot.sqlite
          key: ep-db-${{ github.run_id }}
          restore-keys: ep-db-
      - name: Search PubMed and ClinicalTrials.gov and build the digest
        run: |
          set -o pipefail
          ep-copilot run --days 30 2>&1 | tee run.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## EP Research Copilot (real PubMed and ClinicalTrials.gov data)"
            echo '```'
            cat run.txt 2>/dev/null || echo "run did not produce output"
            echo '```'
            if [ "${{ github.event.repository.private }}" = "true" ]; then
              echo "Download the **ep-copilot-digest** artifact below. It quotes publishers' abstracts: share privately."
            else
              echo "This repository is public, so only the trial tables are attached (**ep-copilot-trials**). For the full digest with abstract quotes, run \`ep-copilot run --days 30\` on your own computer."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The digest and evidence files quote publishers' abstracts. Upload them only while the
      # repository is private; a public repository gets the trial tables and run counts only.
      - name: Upload full digest (private repository only)
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: ep-copilot-digest
          path: ep-research-copilot/output/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload trial tables only (public repository; no abstracts)
        if: always() && !github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: ep-copilot-trials
          path: |
            ep-research-copilot/output/trials.csv
            ep-research-copilot/output/trial_changes.csv
            ep-research-copilot/output/run_metadata.json
          retention-days: 30
          if-no-files-found: warn
