[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwmc-quality-signal-monitor"
version = "0.2.0"
description = "Reproducible benchmarking of public CMS HCAHPS patient-experience data for UW Medical Center"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "jinja2>=3.1",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
pdf = ["weasyprint>=60"]

[project.scripts]
uwmc-monitor = "uwmc_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uwmc_monitor = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
